name: Paper Replay Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "app/research/**"
      - "app/metrics/**"
      - "app/paper/**"
      - "app/positions/**"
      - "app/storage/**"
      - "tests/test_paper_replay*.py"
      - "requirements.txt"
      - ".github/workflows/paper-replay.yml"
  pull_request:
    paths:
      - "app/research/**"
      - "app/metrics/**"
      - "app/paper/**"
      - "app/positions/**"
      - "app/storage/**"
      - "tests/test_paper_replay*.py"
      - "requirements.txt"
      - ".github/workflows/paper-replay.yml"

jobs:
  replay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_paper_replay.py tests/test_paper_replay_cli.py
